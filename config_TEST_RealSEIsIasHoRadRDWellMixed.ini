[inputs]
graph_name = default_graph_name
data_dir = data/
roads_name = data/roads_france_sources/road.shp
regions_covid19_data_dir = data/
# %% https://www.data.gouv.fr/fr/datasets/r/ab21d892-aa39-466a-a3ed-dc25ff076b78
shapefile_name = data/departments/dpts/departements-20140306-5m.shp
# %% https://www.data.gouv.fr/fr/datasets/contours-des-departements-francais-issus-d-openstreetmap/
# %% download link: http://osm13.openstreetmap.fr/~cquest/openfla/export/departements-20180101-shp.zip
# %% name of file = 'Export 2018 - vérifié, non simplifié'
# %% this data file contains a field surf_km2 with surfaces that we need to compute densities   
# shapefile_name = data/departments/departements-20180101-shp/departements-20180101.shp
# %% https://www.data.gouv.fr/fr/datasets/frequentation-en-gares/
gareFile_name = data/departments/frequentation-gares.csv
# %% https://www.insee.fr/fr/statistiques/1893198
ageFile_name = data/departments/estim-pop-dep-sexe-gca-1975-2020.xls
# %% https://www.ecologique-solidaire.gouv.fr/sites/default/files/bulletin_stat_trafic_aerien_2018.pdf
airplaneFile_name = data/bulletin_stat_trafic_aerien_2018-france_passager.xlsx
# %% https://github.com/kalisio/covid-19/
# %% full data is located in data/covid19_france_departments/
# covid19DepartmentsDir_name = data/covid19_france_departments/departements-france/
covid19DepartmentsDir_name = data/covid19_france_departments/departements-france/
covid19RegionsDir_name = data/covid19_france_departments/regions-france/
# list of regions and french departments
#https://www.regions-et-departements.fr/departements-francais#departements_fichiers
# some departments names were modified to fit other names
departments_name= data/departments/departements-francais.csv
# list of french cities with postal code, several writting of names
citiesFile_name = data/villes_france_correct.csv
# contains a dictionnary with all franceGeom data
# if the file doesn not exist, it will be generated, otherwise it will be read
# franceGeom_name = franceGeomRegions.txt
franceGeom_name = data/franceGeomRegions.txt

[graph]
# location can be either 'metropole', 'outremer' or 'all'
location = all
# type can either be 'regions' or 'departments', 'fullConnectedRegions',
# 'fullConnectedDepartments'
# fullConnectedRegions has the number of nodes as number of regions
# but every node is connected to every other node
graph_type = regions
# quit after generation of the graph
genAndQuit = False

[model]
# model_name can be: 'SIRWellMixed', 'SIROnGraph', SIRDWellMixed, SIRDOnGraph
# 'SIRerlangWellMixed', 'SIRerlangOnGraph'
model_name = RealSEIsIasHoRadRDWellMixed
# model_name = RealSIRLDmodifiedWellMixed
# model_name = RealSIRLDmodifiedWellMixed
# load data from this day
# day after confinment
# 4 days mean incubation time
# 15 days mean recovery time
# day after lockdown
time_start_day = 2020-03-18
# k_SE will be divided by total population (= N = 67063703.0) in the initmodels function
# same rate for: S + I_s --> E + I_s 
# and            S + I_as --> E + I_as 
# k_SE =  0.9308210495548875
# k_EIs =  0.8139601503224101
# k_EIas =  0.017770683877817123
# k_IsR =  0.14815814563901034
# k_IsHo =  0.9755172167035646
# k_IasR =  0.18330283508962814
# k_HoRad =  0.04841367498035429
# k_HoD =  0.01436494523597667
# E_ini =  195
# Ias_ini =  162
# Is_ini =  199
# R_ini =  26

k_SE =  9.533502360329418
k_EIs =  0.7622580209367352
k_EIas =  0.3929091219327315
k_IsR =  9.661849301027521
k_IsHo =  0.030465287692471196
k_IasR =  8.726115944695929
k_HoRad =  0.04642731836210684
k_HoD =  0.013493060197157493
E_ini =  2656
Ias_ini =  94524
Is_ini =  3
R_ini =  26111

[settings]
time_start = 0.
time_end = 54

