[inputs]
graph_name = default_graph_name
data_dir = data/
roads_name = data/roads_france_sources/road.shp
regions_covid19_data_dir = data/
shapefile_name = data/departments/dpts/departements-20140306-5m.shp
garefile_name = data/departments/frequentation-gares.csv
agefile_name = data/departments/estim-pop-dep-sexe-gca-1975-2020.xls
airplanefile_name = data/bulletin_stat_trafic_aerien_2018-france_passager.xlsx
covid19departmentsdir_name = data/covid19_france_departments/departements-france/
covid19regionsdir_name = data/covid19_france_departments/regions-france/
departments_name = data/departments/departements-francais.csv
citiesfile_name = data/villes_france_correct.csv
francegeom_name = data/franceGeomRegions.txt

[graph]
location = metropole
graph_type = regions
genandquit = False

[model]
model_name = SIROnGraphAgentBased
k_si = 0
k_ir = 0
s_ini = 1300
i_ini = 0
r_ini = 0

[settings]
time_start = 0.0
time_end = 100
seed_num = 0

[fit]
fit_model = False
with_odes = False
dates_for_fit = 2020-03-02, 2020-03-03, 2020-03-04, 2020-03-05, 2020-03-06, 2020-03-07, 2020-03-08, 2020-03-09, 2020-03-10, 2020-03-11, 2020-03-12, 2020-03-13, 2020-03-14, 2020-03-15, 2020-03-16, 2020-03-17
method = differential_evolution

[outputs]
outputs_dir = outputs/VALIDATIONS/SIR_compartments_fullConnectedRegions_agent_based/
plot_options = WellMixed, AllNodes, FinalGraph, AvgNodesVisited
save_frequency = 1

